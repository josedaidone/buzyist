version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (it updates the
  # "# vX.Y.Z" comment along with the SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python requirements (runtime, build and dev): no version-update PRs. Dependabot
  # recompiles the locks on Linux, which drops the Windows-only packages (colorama,
  # so CI's --require-hashes install fails) and adds Linux-only ones (python-xlib);
  # they have to be recompiled on Windows instead (CLAUDE.md, "Data and packaging").
  # Vulnerabilities still reach us: the repo's Dependabot alerts are on, and CI's
  # pip-audit fails on any known CVE in the three lock files.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
