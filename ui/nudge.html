<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="nudge.title">buZyist</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  /* A "beep" app limit's popup (App.show_nudge, NUDGE_* in buzyist/constants.py):
     the reminder and the buttons that mute the beeps for a while. */
  body { background: var(--bg); overflow: hidden; }
  .nudge {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; padding: 12px 12px 12px 16px;
    border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg);
  }
  .n-head { display: flex; align-items: center; gap: 8px; }
  .n-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bz-tomate); flex: none; }
  .n-title { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n-close {
    width: 24px; height: 24px; border: 0; padding: 0; border-radius: 50%; display: grid; place-items: center;
    background: transparent; color: var(--muted); cursor: pointer; flex: none;
  }
  .n-close:hover { background: var(--surface); color: var(--ink); }
  .n-close svg { width: 13px; height: 13px; }
  .n-text {
    font-size: 13px; color: var(--muted); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .n-mute { margin-top: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
  .n-mute .btn { height: 30px; padding: 0 12px; font-size: 12.5px; }
  .n-done { margin-top: auto; font-size: 13px; font-weight: 700; color: var(--done); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>
<div class="nudge" id="nudge">
  <div class="n-head">
    <span class="n-dot"></span><span class="n-title" id="nTitle"></span>
    <button class="n-close" id="nClose" title="Close" data-i18n-title="nudge.close"><svg><use href="#i-x"/></svg></button>
  </div>
  <div class="n-text" id="nText"></div>
  <div class="n-mute" id="nMute">
    <span data-i18n="nudge.mute">Mute:</span>
    <button type="button" class="btn" data-mute="15m" data-i18n="nudge.mute_15m">15 min</button>
    <button type="button" class="btn" data-mute="1h" data-i18n="nudge.mute_1h">1 hour</button>
    <button type="button" class="btn" data-mute="tomorrow" data-i18n="nudge.mute_tomorrow">Until tomorrow</button>
  </div>
  <div class="n-done hidden" id="nDone"></div>
</div>
<script src="i18n.js"></script>
<script src="nudge.js"></script>
</body>
</html>
